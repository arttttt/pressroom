# How Pressroom becomes something you can drag into Applications.
#
# For one person on one Mac, so: no signing identity, no notarisation, no
# update server. macOS therefore quarantines the first copy that arrives from
# anywhere but the Finder — `pnpm run install:mac` clears that attribute on the
# copy it installs, which is the whole reason that script exists.

appId: com.arttttt.pressroom
productName: Pressroom
copyright: © 2026 Artem Bambalov

directories:
  buildResources: build
  output: release

# Everything the application runs from, and nothing that built it. The renderer
# is bundled whole, so no dependency ships at runtime — `out` and the manifest
# are the entire program.
files:
  - out/**
  - package.json

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Apple Silicon only: this is a macOS-only application on the machine that
  # wrote it, and a universal build doubles the size for nobody.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # Unsigned on purpose. A signing identity would need a paid developer
  # account, and this never leaves the machine.
  identity: null
  # The window is dark and the application draws its own title bar area.
  darkModeSupport: true

dmg:
  title: Pressroom
  # The two things a person does with a disk image, side by side.
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
