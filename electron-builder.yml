# How Pressroom becomes a disk image to drag into Applications.
#
# For one person on one Mac: no developer certificate, no notarisation, no
# update server. The one thing that cannot be skipped is a signature of some
# kind — see scripts/adhoc-sign.cjs, which runs before the image is built.

appId: com.arttttt.pressroom
productName: Pressroom
copyright: © 2026 Artem Bambalov

directories:
  buildResources: build
  output: release

# Signed ad hoc once the bundle is packed and before the image wraps it, so
# what the image contains is an application that launches.
afterPack: scripts/adhoc-sign.cjs

# Everything the application runs from, and nothing that built it. The renderer
# is bundled whole, so no dependency ships at runtime — `out` and the manifest
# are the entire program.
files:
  - out/**
  - package.json

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Apple Silicon only: this is a macOS-only application on the machine that
  # wrote it, and a universal build doubles the size for nobody.
  target:
    - target: dmg
      arch: [arm64]
  # No certificate: signing is done ad hoc by the hook above, which is all
  # Apple Silicon needs to let a locally built application run.
  identity: null
  # The window is dark and the application draws its own title bar area.
  darkModeSupport: true

dmg:
  title: Pressroom
  # The two things a person does with a disk image, side by side.
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
